<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TokenTrail</title>
    <script>
      // Dev-only Tauri mock: open the dev server with ?mock in the URL
      // (e.g. http://localhost:1420/?mock) to work on the UI with synthetic
      // data when the Rust backend isn't running. The real app always has
      // __TAURI_INTERNALS__ injected before this script, so this never fires.
      if (!window.__TAURI_INTERNALS__ && location.search.includes('mock')) {
        (function () {
          let seed = 42;
          const rng = () => ((seed = (seed * 1664525 + 1013904223) >>> 0), seed / 4294967296);
          const iso = (offset) => new Date(Date.now() - offset * 86400000).toISOString().slice(0, 10);
          const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

          const SOURCES = ['claude_code', 'codex', 'zcode', 'antigravity', 'devin', 'opencode', 'gemini', 'wackchatter', 'wackcode'];
          const WEIGHT = [0.5, 0.2, 0.09, 0.06, 0.05, 0.04, 0.02, 0.02];
          const MODELS = [
            ['claude-opus-5', 8.1e6, ['claude_code', 'zcode'], 118.4, 2910, 412],
            ['claude-sonnet-5', 5.4e6, ['claude_code', 'opencode'], 61.2, 2140, 318],
            ['gemini-3-pro', 2.1e6, ['gemini', 'antigravity'], 24.8, 980, 145],
            ['gpt-5.6-sol', 1.6e6, ['codex'], 31.05, 812, 98],
            ['gpt-5.5', 1.3e6, ['codex', 'opencode'], 18.9, 660, 87],
            ['claude-haiku-4-5', 588e3, ['claude_code'], 2.1, 1240, 201],
            ['swe-1-6-slow', 420e3, ['devin'], 0, 214, 37],
          ];
          const PROJECTS = [
            ['~/dev/TokenTrail', 0.31], ['~/dev/aurora-api', 0.24], ['~/work/billing-svc', 0.2],
            ['~/dev/website', 0.15], ['~/notes/scripts', 0.1],
          ];

          function walk(base, n) {
            const out = [];
            let v = base;
            for (let i = 0; i < n; i++) {
              v += (rng() - 0.48) * base * 0.5;
              v = clamp(v, base * 0.1, base * 2.2);
              const dow = i % 7;
              out.push(v * (dow === 5 || dow === 6 ? 0.35 : 1) * (0.4 + (i / n) * 0.8));
            }
            return out;
          }

          const dailyRows = (n) => {
            const rows = [];
            SOURCES.forEach((src, si) => {
              walk((WEIGHT[si] || 0.02) * 950000, n).forEach((tok, i) => {
                rows.push({ date: iso(n - 1 - i), source: src, tokens: Math.round(tok), cost_usd: tok * 0.000019 });
              });
            });
            return rows;
          };

          // in-memory project colors so the picker round-trips in ?mock mode
          const PROJECT_COLORS = {};

          // ── WackCode synthetic ledger ──────────────────────────────────
          // Deterministic per seed: chats, their call timelines and every
          // aggregate are derived from the same rows the "backend" would store.
          const WC_PURPOSES = [
            ['chat', 0.62], ['subagent', 0.21], ['compaction', 0.05], ['title', 0.05],
            ['branch_summary', 0.03], ['goal_verification', 0.025], ['commit_message', 0.015],
          ];
          const WC_MODELS = [['claude-sonnet-4-5', 0.55], ['glm-5.3', 0.25], ['gpt-5-codex', 0.2]];
          const WC_PROJECTS = ['~/dev/TokenTrail', '~/dev/aurora-api', '~/work/billing-svc', '~/notes/scripts'];
          const wcPick = (r, pairs) => {
            const x = r();
            let acc = 0;
            for (const [v, w] of pairs) { acc += w; if (x < acc) return v; }
            return pairs[pairs.length - 1][0];
          };
          const WC_SESSIONS = (() => {
            let s = 4242;
            const r = () => ((s = (s * 1664525 + 1013904223) >>> 0), s / 4294967296);
            const hex = (n) => Array.from({ length: n }, () => '0123456789abcdef'[Math.floor(r() * 16)]).join('');
            return Array.from({ length: 26 }, (_, i) => {
              const id = hex(24) + i; // uniqueness guard on top of the rng
              const project = WC_PROJECTS[Math.floor(r() * WC_PROJECTS.length)];
              const lastTs = Date.now() - Math.floor(r() * 150) * 86400000 - Math.floor(r() * 86400000);
              const spanMs = (2 + r() * 26) * 3600000;
              const nCalls = 5 + Math.floor(r() * 34);
              let cs = 9000 + i * 131;
              const cr = () => ((cs = (cs * 1664525 + 1013904223) >>> 0), cs / 4294967296);
              const calls = Array.from({ length: nCalls }, (_, k) => {
                const purpose = wcPick(cr, WC_PURPOSES);
                const model = wcPick(cr, WC_MODELS);
                const big = purpose === 'chat' || purpose === 'subagent';
                const isSub = purpose === 'subagent' || (purpose !== 'chat' && cr() < 0.15);
                const roll = cr();
                const outcome = roll < 0.93 ? 'completed' : roll < 0.97 ? 'failed' : 'cancelled';
                const tokens = Math.round(big ? 18000 + cr() * 102000 : 200 + cr() * 2800);
                return {
                  ts: Math.round(lastTs - spanMs + (k / nCalls) * spanMs + cr() * 900000),
                  purpose,
                  subagent_id: isSub ? hex(8) : null,
                  model,
                  outcome,
                  tokens,
                  duration_ms: Math.round(big ? 3000 + cr() * 17000 : 300 + cr() * 1700),
                };
              });
              calls.sort((a, b) => a.ts - b.ts);
              return { id, project, calls };
            });
          })();
          function wcDetail(days) {
            const cut = days >= 3650 ? 0 : Date.now() - days * 86400000;
            const rows = WC_SESSIONS.flatMap((s) => s.calls.filter((c) => c.ts >= cut).map((c) => ({ ...c, session: s })));
            if (!rows.length) {
              return {
                total_tokens: 0, input_tokens: 0, output_tokens: 0, cache_read_tokens: 0, cache_write_tokens: 0,
                events: 0, sessions: 0, active_days: 0, cost_usd: 0, first_ts: null, last_ts: null,
                subagent_events: 0, subagent_tokens: 0, avg_duration_ms: 0, p50_duration_ms: 0,
                by_purpose: [], by_outcome: [], by_model: [], by_provider: [], by_project: [], daily: [], sessions_list: [],
              };
            }
            const total = rows.reduce((a, c) => a + c.tokens, 0);
            const durations = rows.map((c) => c.duration_ms).sort((a, b) => a - b);
            const group = (keyFn) => {
              const m = new Map();
              for (const c of rows) {
                const k = keyFn(c);
                const g = m.get(k) ?? { name: k, events: 0, tokens: 0, cost_usd: 0 };
                g.events++; g.tokens += c.tokens; g.cost_usd += c.tokens * 0.000012;
                m.set(k, g);
              }
              return [...m.values()].sort((a, b) => b.tokens - a.tokens);
            };
            const outcomes = ['completed', 'failed', 'cancelled'].map((o) => ({ outcome: o, events: rows.filter((c) => c.outcome === o).length })).filter((o) => o.events);
            const subs = rows.filter((c) => c.subagent_id);
            return {
              total_tokens: total,
              input_tokens: Math.round(total * 0.28), output_tokens: Math.round(total * 0.17),
              cache_read_tokens: Math.round(total * 1.4), cache_write_tokens: Math.round(total * 0.3),
              events: rows.length,
              sessions: new Set(rows.map((c) => c.session.id)).size,
              active_days: new Set(rows.map((c) => new Date(c.ts).toISOString().slice(0, 10))).size,
              cost_usd: total * 0.000012,
              first_ts: Math.min(...rows.map((c) => c.ts)), last_ts: Math.max(...rows.map((c) => c.ts)),
              subagent_events: subs.length, subagent_tokens: subs.reduce((a, c) => a + c.tokens, 0),
              avg_duration_ms: Math.round(durations.reduce((a, b) => a + b, 0) / durations.length),
              p50_duration_ms: durations[Math.floor((durations.length - 1) / 2)],
              by_purpose: group((c) => c.purpose).map((g) => ({ purpose: g.name, requests: g.events, tokens: g.tokens, cost_usd: g.cost_usd })),
              by_outcome: outcomes,
              by_model: group((c) => c.model),
              by_provider: group((c) => (c.model.startsWith('claude') ? 'anthropic' : c.model.startsWith('glm') ? 'zai' : 'openai')),
              by_project: group((c) => c.session.project),
              daily: Object.entries(rows.reduce((m, c) => {
                const k = new Date(c.ts).toISOString().slice(0, 10) + '|' + c.purpose;
                m[k] = (m[k] ?? 0) + c.tokens;
                return m;
              }, {})).map(([k, tokens]) => { const [date, purpose] = k.split('|'); return { date, purpose, tokens }; }),
              sessions_list: WC_SESSIONS.filter((s) => s.calls.some((c) => c.ts >= cut)).map((s) => {
                const cs = s.calls.filter((c) => c.ts >= cut);
                const done = cs.filter((c) => c.outcome === 'completed').length;
                return {
                  session_id: s.id, project: s.project,
                  models: [...new Set(cs.map((c) => c.model))].sort(),
                  events: cs.length, subagents: cs.filter((c) => c.subagent_id).length,
                  tokens: cs.reduce((a, c) => a + c.tokens, 0), cost_usd: cs.reduce((a, c) => a + c.tokens, 0) * 0.000012,
                  completed: done, failed: cs.filter((c) => c.outcome === 'failed').length,
                  cancelled: cs.filter((c) => c.outcome === 'cancelled').length,
                  first_ts: cs[0].ts, last_ts: cs[cs.length - 1].ts,
                };
              }).sort((a, b) => b.last_ts - a.last_ts),
            };
          }

          const totalTokens = MODELS.reduce((s, m) => s + m[1], 0);
          const totalCost = MODELS.reduce((s, m) => s + m[3], 0);
          const totalEvents = MODELS.reduce((s, m) => s + m[4], 0);
          const totalSessions = MODELS.reduce((s, m) => s + m[5], 0);

          function mockData(cmd, args) {
            switch (cmd) {
              case 'get_wackcode_detail': return wcDetail(args.days ?? 90);
              case 'get_wackcode_session_calls':
                return (WC_SESSIONS.find((s) => s.id === args.sessionId) ?? { calls: [] }).calls;
              case 'get_overview':
                return {
                  total_tokens: totalTokens, input_tokens: totalTokens * 0.62, output_tokens: totalTokens * 0.31,
                  cache_read_tokens: totalTokens * 1.7, cache_write_tokens: totalTokens * 0.55,
                  events: totalEvents, sessions: totalSessions, active_days: 214,
                  cost_usd: totalCost, first_ts: Date.now() - 420 * 86400000, last_ts: Date.now(),
                  current_streak: 59, longest_streak: 73,
                  by_source: SOURCES.map((s, i) => ({
                    source: s, tokens: Math.round(totalTokens * (WEIGHT[i] / 0.99)),
                    events: Math.round(totalEvents * WEIGHT[i] * 1.6), sessions: Math.round(totalSessions * WEIGHT[i] * 1.8),
                    cost_usd: totalCost * WEIGHT[i] * 1.1,
                  })),
                };
              case 'get_daily': return dailyRows(args.days ?? 90);
              case 'get_by_model':
                return MODELS.map((m) => ({ model: m[0], tokens: m[1] * (args.days > 90 ? 1 : 0.4), events: m[4], cost_usd: m[3], last_ts: Date.now() - MODELS.indexOf(m) * 86400000 }));
              case 'get_active_days': return Math.min(args.days ?? 90, 214);
              case 'get_model_stats':
                return MODELS.map((m) => ({
                  model: m[0], tokens: m[1], input_tokens: m[1] * 0.62, output_tokens: m[1] * 0.31,
                  cache_read_tokens: m[1] * 1.6, cache_write_tokens: m[1] * 0.5,
                  events: m[4], sessions: m[5], cost_usd: m[3],
                  first_ts: Date.now() - 300 * 86400000, last_ts: Date.now() - MODELS.indexOf(m) * 86400000, sources: m[2],
                  active_days: Math.max(1, Math.min(Math.round((args.days ?? 90) * 0.6), 42)),
                }));
              case 'get_daily_by_model': {
                const n = Math.min(args.days ?? 90, 150);
                const rows = [];
                MODELS.forEach((m, mi) => {
                  walk((m[1] / 40), n).forEach((tok, i) => rows.push({ date: iso(n - 1 - i), model: m[0], tokens: Math.round(tok * (1 - mi * 0.1)) }));
                });
                return rows;
              }
              case 'get_daily_cache': {
                const n = Math.min(args.days ?? 90, 365);
                return Array.from({ length: n }, (_, i) => {
                  const d = iso(n - 1 - i);
                  const base = 400000 * (0.4 + (i / n) * 0.8);
                  return { date: d, fresh_input: Math.round(base * 0.4), cache_write: Math.round(base * 0.2), cache_read: Math.round(base * 2.6 * (0.6 + rng() * 0.8)) };
                });
              }
              case 'get_model_detail': {
                const m = MODELS.find((x) => x[0] === args.model);
                if (!m) return null;
                const n = Math.min(args.days ?? 90, 150);
                const daily = Array.from({ length: n }, (_, i) => ({ date: iso(n - 1 - i), tokens: Math.round(m[1] / 90 * (0.3 + rng() * 1.7)) }));
                return {
                  model: m[0], tokens: m[1], input_tokens: m[1] * 0.62, output_tokens: m[1] * 0.31,
                  reasoning_tokens: Math.round(m[1] * 0.12),
                  cache_read_tokens: m[1] * 1.6, cache_write_tokens: m[1] * 0.5,
                  events: m[4], sessions: m[5], cost_usd: m[3],
                  first_ts: Date.now() - Math.min(args.days ?? 300, 300) * 86400000, last_ts: Date.now() - 3600000,
                  active_days: Math.min(187, n), current_streak: 12, longest_streak: 40,
                  peak_day: iso(9), peak_day_tokens: m[1] / 30,
                  by_source: m[2].map((s, i) => ({ source: s, tokens: m[1] * (i ? 0.3 : 0.7), events: m[4] * (i ? 0.3 : 0.7), sessions: m[5] * (i ? 0.3 : 0.7), cost_usd: m[3] * (i ? 0.3 : 0.7) })),
                  by_project: PROJECTS.map((p, i) => ({ project: p[0], tokens: m[1] * p[1], events: m[4] * p[1], sessions: m[5] * p[1], cost_usd: m[3] * p[1], first_ts: Date.now() - 280 * 86400000, last_ts: Date.now() - i * 7200000 })),
                  daily,
                  total_window_tokens: totalTokens,
                };
              }
              case 'get_model_achievements': {
                const m = MODELS.find((x) => x[0] === args.model);
                if (!m) return [];
                return [
                  { kind: 'peak_day', tier: null, title: 'Peak Day', value: '4.2M tokens', earned_ts: Date.now() - 9 * 86400000 },
                  { kind: 'longest_streak', tier: null, title: 'Longest Streak', value: '40 days in a row', earned_ts: Date.now() - 14 * 86400000 },
                  { kind: 'multi_harness', tier: null, title: 'Multi-Harness', value: `Used in ${m[2].length} harnesses`, earned_ts: Date.now() - 60 * 86400000 },
                  { kind: 'family_champion', tier: null, title: 'Family Champion', value: 'Top model in Claude', earned_ts: null },
                  { kind: 'token_milestone', tier: '100m', title: '100M Tokens', value: '100M tokens', earned_ts: Date.now() - 120 * 86400000 },
                  { kind: 'token_milestone', tier: '500m', title: '500M Tokens', value: '500M tokens', earned_ts: Date.now() - 90 * 86400000 },
                  { kind: 'token_milestone', tier: '1b', title: '1B Tokens', value: '1B tokens', earned_ts: Date.now() - 30 * 86400000 },
                  { kind: 'big_spender', tier: '100', title: '$100 Spent', value: '$100 spent', earned_ts: Date.now() - 75 * 86400000 },
                  { kind: 'first_project', tier: null, title: 'First Project', value: 'tokentrail', earned_ts: Date.now() - 280 * 86400000 },
                  { kind: 'project_explorer', tier: null, title: 'Project Explorer', value: 'Used in 4 projects', earned_ts: Date.now() - 45 * 86400000 },
                ];
              }
              case 'get_by_project':
                return PROJECTS.map((p, i) => ({ project: p[0], tokens: Math.round(totalTokens * p[1]), events: Math.round(totalEvents * p[1]), sessions: Math.round(totalSessions * p[1]), cost_usd: totalCost * p[1], first_ts: Date.now() - 400 * 86400000, last_ts: Date.now() - i * 172800000 }));
              case 'get_daily_by_project': {
                const n = Math.min(args.days ?? 90, 150);
                const rows = [];
                PROJECTS.forEach((p, pi) => {
                  walk(totalTokens * p[1] / 90, n).forEach((tok, i) => {
                    rows.push({ date: iso(n - 1 - i), project: p[0], tokens: Math.round(tok), cost_usd: tok * 0.000019 });
                  });
                });
                return rows;
              }
              case 'get_project_colors':
                return Object.entries(PROJECT_COLORS).map(([project, color]) => ({ project, color })).sort((a, b) => a.project.localeCompare(b.project));
              case 'set_project_color': {
                if (args.color == null) delete PROJECT_COLORS[args.project];
                else PROJECT_COLORS[args.project] = String(args.color).toLowerCase();
                return null;
              }
              case 'get_project_detail': {
                const proj = PROJECTS.find((x) => x[0] === args.project);
                if (!proj && args.project !== 'unknown') return null;
                const pShare = proj ? proj[1] : 0.05;
                const pTokens = Math.round(totalTokens * pShare);
                const pEvents = Math.round(totalEvents * pShare);
                const pSessions = Math.round(totalSessions * pShare);
                const pCost = totalCost * pShare;
                const n = Math.min(args.days ?? 90, 150);
                const daily = Array.from({ length: n }, (_, i) => ({ date: iso(n - 1 - i), tokens: Math.round(pTokens / 90 * (0.2 + rng() * 1.8)) }));
                const by_model = MODELS.slice(0, 4).map((m, i) => {
                  const share = [0.5, 0.3, 0.15, 0.05][i];
                  return {
                    model: m[0],
                    tokens: Math.round(pTokens * share),
                    input_tokens: Math.round(pTokens * share * 0.65),
                    output_tokens: Math.round(pTokens * share * 0.35),
                    events: Math.round(pEvents * share),
                    sessions: Math.max(1, Math.round(pSessions * share)),
                    cost_usd: pCost * share,
                    first_ts: Date.now() - 120 * 86400000,
                    last_ts: Date.now() - i * 3600000,
                  };
                });
                const by_source = SOURCES.slice(0, 3).map((s, i) => ({
                  source: s,
                  tokens: Math.round(pTokens * (i === 0 ? 0.6 : i === 1 ? 0.3 : 0.1)),
                  events: Math.round(pEvents * (i === 0 ? 0.6 : i === 1 ? 0.3 : 0.1)),
                  sessions: Math.max(1, Math.round(pSessions * (i === 0 ? 0.6 : i === 1 ? 0.3 : 0.1))),
                  cost_usd: pCost * (i === 0 ? 0.6 : i === 1 ? 0.3 : 0.1),
                }));
                const sessions_list = Array.from({ length: Math.min(pSessions, 15) }, (_, i) => ({
                  session_id: 'sess-' + (1000 + i) + '-mock',
                  source: SOURCES[i % 3],
                  events: Math.round(10 + rng() * 40),
                  tokens: Math.round(pTokens / pSessions * (0.5 + rng())),
                  cost_usd: (pCost / pSessions) * (0.5 + rng()),
                  first_ts: Date.now() - (i * 86400000 + Math.round(rng() * 3600000)),
                  last_ts: Date.now() - i * 86400000,
                  models: [MODELS[i % 4][0]],
                }));
                return {
                  project: args.project,
                  tokens: pTokens,
                  input_tokens: Math.round(pTokens * 0.65),
                  output_tokens: Math.round(pTokens * 0.35),
                  reasoning_tokens: Math.round(pTokens * 0.08),
                  cache_read_tokens: Math.round(pTokens * 1.4),
                  cache_write_tokens: Math.round(pTokens * 0.3),
                  events: pEvents,
                  sessions: pSessions,
                  cost_usd: pCost,
                  first_ts: Date.now() - 150 * 86400000,
                  last_ts: Date.now() - 1800000,
                  active_days: Math.min(n, 42),
                  current_streak: 5,
                  longest_streak: 18,
                  peak_day: iso(4),
                  peak_day_tokens: Math.round(pTokens / 20),
                  by_model,
                  by_source,
                  daily,
                  sessions_list,
                  total_window_tokens: totalTokens,
                };
              }
              case 'get_heatmap':
                return Array.from({ length: args.days ?? 365 }, (_, i) => ({ date: iso((args.days ?? 365) - 1 - i), tokens: i % 7 < 5 && rng() > 0.25 ? Math.round(200000 + rng() * 2400000) : 0 }));
              case 'get_hourly':
                return Array.from({ length: 24 }, (_, h) => ({ hour: h, tokens: Math.round(120000 * (h < 6 ? 1.4 - h * 0.15 : h >= 10 && h <= 18 ? 1.8 : 0.7) * (0.6 + rng() * 0.8)) }));
              case 'get_peak_days': {
                const maxDays = args.days && args.days > 0 ? args.days : 365;
                return [
                  { model: 'claude-sonnet-4.5', date: iso(Math.min(12, maxDays - 1)), tokens: 48200000, cost_usd: 144.60 },
                  { model: 'gemini-2.5-pro', date: iso(Math.min(25, maxDays - 1)), tokens: 32100000, cost_usd: 40.12 },
                  { model: 'claude-sonnet-4.5', date: iso(Math.min(5, maxDays - 1)), tokens: 28900000, cost_usd: 86.70 },
                  { model: 'gpt-5', date: iso(Math.min(18, maxDays - 1)), tokens: 24500000, cost_usd: 73.50 },
                  { model: 'deepseek-v4-pro', date: iso(Math.min(30, maxDays - 1)), tokens: 19800000, cost_usd: 15.84 },
                ].filter((_, i) => args.days === 30 ? i < 4 : true);
              }
              case 'get_source_status':
                return SOURCES.map((s, i) => ({ source: s, display: s.replace('_', ' '), path: '/home/dev/.config/' + s, found: i !== 5 }));
              // Only WackChatter ever reports estimates; the harnesses are all measured.
              case 'get_estimated_share':
                return [{ source: 'wackchatter', events: 1400, estimated: 874 }];
              case 'get_model_aliases': return [];
              case 'get_raw_models': return MODELS.map((m) => m[0]);
              case 'get_hidden_models': return ['codex-auto-review'];
              case 'sync_now': return SOURCES.map((s) => ({ source: s, processed: Math.round(rng() * 400), error: null }));
              case 'export_data': return '/home/dev/.local/share/TokenTrail/usage.' + (args.format ?? 'csv');
              case 'get_family_stats': {
                const fams = {};
                MODELS.forEach((m) => {
                  const norm = m[0].split('/').pop().split('[')[0].trim().toLowerCase();
                  const fam = norm.startsWith('claude') ? 'Claude' : norm.startsWith('gpt') ? 'GPT' : norm.startsWith('gemini') ? 'Gemini' : 'Other';
                  if (!fams[fam]) fams[fam] = { family: fam, tokens: 0, input_tokens: 0, output_tokens: 0, cache_read_tokens: 0, cache_write_tokens: 0, events: 0, sessions: 0, cost_usd: 0, first_ts: Date.now() - 300 * 86400000, last_ts: Date.now(), sources: new Set(), models: [] };
                  const row = { model: m[0], tokens: m[1], input_tokens: m[1] * 0.62, output_tokens: m[1] * 0.31, cache_read_tokens: m[1] * 1.6, cache_write_tokens: m[1] * 0.5, events: m[4], sessions: m[5], cost_usd: m[3], first_ts: Date.now() - 300 * 86400000, last_ts: Date.now() - MODELS.indexOf(m) * 86400000, sources: m[2] };
                  const f = fams[fam]; f.tokens += m[1]; f.input_tokens += row.input_tokens; f.output_tokens += row.output_tokens; f.cache_read_tokens += row.cache_read_tokens; f.cache_write_tokens += row.cache_write_tokens; f.events += m[4]; f.sessions += m[5]; f.cost_usd += m[3]; m[2].forEach((s) => f.sources.add(s)); f.models.push(row);
                });
                return Object.values(fams).map((f) => ({ ...f, sources: [...f.sources], models: f.models.sort((a, b) => b.tokens - a.tokens) })).sort((a, b) => b.tokens - a.tokens);
              }
              case 'plugin:event|listen': return 1;
              default: return null;
            }
          }

          window.__TAURI_INTERNALS__ = {
            metadata: { currentWindow: { label: 'main' }, currentWebview: { label: 'main', windowLabel: 'main' } },
            callbacks: new Map(),
            transformCallback(cb) { const id = this.callbacks.size + 1; this.callbacks.set(id, cb); return id; },
            invoke(cmd, args) { return new Promise((resolve) => setTimeout(() => resolve(mockData(cmd, args ?? {})), 40)); },
          };
        })();
      }
