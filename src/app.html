<html lang="en">
  <head>

    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TokenTrail</title>
    <script>
      // Dev-only Tauri mock: open the dev server with ?mock in the URL
      // (e.g. http://localhost:1420/?mock) to work on the UI with synthetic
      // data when the Rust backend isn't running. The real app always has
      // __TAURI_INTERNALS__ injected before this script, so this never fires.
      if (location.search.includes('mock')) {
        (function () {
          let seed = 42;
          const rng = () => ((seed = (seed * 1664525 + 1013904223) >>> 0), seed / 4294967296);
          const iso = (offset) => new Date(Date.now() - offset * 86400000).toISOString().slice(0, 10);
          const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

          const SOURCES = ['claude_code', 'codex', 'zcode', 'antigravity', 'devin', 'opencode', 'gemini', 'wackchatter', 'wackcode'];
          const WEIGHT = [0.5, 0.2, 0.09, 0.06, 0.05, 0.04, 0.02, 0.02];
          const MODELS = [
            ['claude-opus-5', 8.1e6, ['claude_code', 'zcode'], 118.4, 2910, 412],
            ['claude-sonnet-5', 5.4e6, ['claude_code', 'opencode'], 61.2, 2140, 318],
            ['gemini-3-pro', 2.1e6, ['gemini', 'antigravity'], 24.8, 980, 145],
            ['gpt-5.6-sol', 1.6e6, ['codex'], 31.05, 812, 98],
            ['gpt-5.5', 1.3e6, ['codex', 'opencode'], 18.9, 660, 87],
            ['claude-haiku-4-5', 588e3, ['claude_code'], 2.1, 1240, 201],
            ['swe-1-6-slow', 420e3, ['devin'], 0, 214, 37],
          ];
          const PROJECTS = [
            ['~/dev/TokenTrail', 0.31], ['~/dev/aurora-api', 0.24], ['~/work/billing-svc', 0.2],
            ['~/dev/website', 0.15], ['~/notes/scripts', 0.1],
          ];

          function walk(base, n) {
            const out = [];
            let v = base;
            for (let i = 0; i < n; i++) {
              v += (rng() - 0.48) * base * 0.5;
              v = clamp(v, base * 0.1, base * 2.2);
              const dow = i % 7;
              out.push(v * (dow === 5 || dow === 6 ? 0.35 : 1) * (0.4 + (i / n) * 0.8));
            }
            return out;
          }

          const dailyRows = (n) => {
            const rows = [];
            SOURCES.forEach((src, si) => {
              walk((WEIGHT[si] || 0.02) * 950000, n).forEach((tok, i) => {
                rows.push({ date: iso(n - 1 - i), source: src, tokens: Math.round(tok), cost_usd: tok * 0.000019 });
              });
            });
            return rows;
          };

          // in-memory project colors and tech stacks so pickers round-trip in ?mock mode
          const PROJECT_COLORS = {};
          const PROJECT_STACKS = {
            '~/dev/TokenTrail': ['Tauri', 'SvelteKit', 'Rust'],
            '~/dev/aurora-api': ['Rust', 'Axum', 'PostgreSQL'],
            '~/dev/website': ['SvelteKit', 'TypeScript'],
          };

          // ── WackCode synthetic ledger ──────────────────────────────────
          // Deterministic per seed: chats, their call timelines and every
          // aggregate are derived from the same rows the "backend" would store.
          const WC_PURPOSES = [
            ['chat', 0.62], ['subagent', 0.21], ['compaction', 0.05], ['title', 0.05],
            ['branch_summary', 0.03], ['goal_verification', 0.025], ['commit_message', 0.015],
          ];
          // Chat mode never touches coding features: main calls and titles only
          const WC_CHAT_PURPOSES = [['chat', 0.88], ['title', 0.12]];
          const WC_HK = new Set(['title', 'compaction', 'branch_summary', 'goal_verification', 'commit_message']);
          // mirrors the backend's derived key: a main-thread call is Code work
          // unless it came from a real Chat mode session
          const wcKey = (purpose, mode) => (purpose === 'chat' ? mode : purpose);
          const WC_MODELS = [['claude-sonnet-4-5', 0.55], ['glm-5.3', 0.25], ['gpt-5-codex', 0.2]];
          const WC_TITLE_MODEL = 'deepseek-v4.1-flash';
          const WC_PROJECTS = ['~/dev/TokenTrail', '~/dev/aurora-api', '~/work/billing-svc', '~/notes/scripts'];
          const wcPick = (r, pairs) => {
            const x = r();
            let acc = 0;
            for (const [v, w] of pairs) { acc += w; if (x < acc) return v; }
            return pairs[pairs.length - 1][0];
          };
          const WC_SESSIONS = (() => {
            let s = 4242;
            const r = () => ((s = (s * 1664525 + 1013904223) >>> 0), s / 4294967296);
            const hex = (n) => Array.from({ length: n }, () => '0123456789abcdef'[Math.floor(r() * 16)]).join('');
            return Array.from({ length: 26 }, (_, i) => {
              const id = hex(24) + i; // uniqueness guard on top of the rng
              const mode = r() < 0.18 ? 'chat' : 'code'; // ~1 in 5 sessions are Chat mode
              const project = mode === 'chat' ? 'unknown' : WC_PROJECTS[Math.floor(r() * WC_PROJECTS.length)];
              const lastTs = Date.now() - Math.floor(r() * 150) * 86400000 - Math.floor(r() * 86400000);
              const spanMs = (2 + r() * 26) * 3600000;
              const nCalls = 5 + Math.floor(r() * 34);
              let cs = 9000 + i * 131;
              const cr = () => ((cs = (cs * 1664525 + 1013904223) >>> 0), cs / 4294967296);
              const mix = mode === 'chat' ? WC_CHAT_PURPOSES : WC_PURPOSES;
              const calls = Array.from({ length: nCalls }, (_, k) => {
                const purpose = wcPick(cr, mix);
                const model = purpose === 'title' ? WC_TITLE_MODEL : wcPick(cr, WC_MODELS);
                const big = purpose === 'chat' || purpose === 'subagent';
                const isSub = purpose === 'subagent' || (purpose !== 'chat' && cr() < 0.15);
                const roll = cr();
                const outcome = roll < 0.93 ? 'completed' : roll < 0.97 ? 'failed' : 'cancelled';
                const tokens = Math.round(big ? 18000 + cr() * 102000 : 200 + cr() * 2800);
                return {
                  ts: Math.round(lastTs - spanMs + (k / nCalls) * spanMs + cr() * 900000),
                  purpose,
                  subagent_id: isSub ? hex(8) : null,
                  model,
                  outcome,
                  tokens,
                  duration_ms: Math.round(big ? 3000 + cr() * 17000 : 300 + cr() * 1700),
                };
              });
              calls.sort((a, b) => a.ts - b.ts);
              return { id, project, mode, calls };
            });
          })();
          function wcDetail(days) {
            const cut = days >= 3650 ? 0 : Date.now() - days * 86400000;
            const rows = WC_SESSIONS.flatMap((s) => s.calls.filter((c) => c.ts >= cut).map((c) => ({ ...c, session: s })));
            if (!rows.length) {
              return {
                total_tokens: 0, input_tokens: 0, output_tokens: 0, cache_read_tokens: 0, cache_write_tokens: 0,
                events: 0, sessions: 0, active_days: 0, cost_usd: 0, first_ts: null, last_ts: null,
                subagent_events: 0, subagent_tokens: 0,
                by_purpose: [], by_outcome: [], by_mode: [], by_model: [], by_provider: [], by_project: [], daily: [], sessions_list: [],
              };
            }
            const total = rows.reduce((a, c) => a + c.tokens, 0);
            const group = (keyFn) => {
              const m = new Map();
              for (const c of rows) {
                const k = keyFn(c);
                const g = m.get(k) ?? { name: k, events: 0, tokens: 0, cost_usd: 0 };
                g.events++; g.tokens += c.tokens; g.cost_usd += c.tokens * 0.000012;
                m.set(k, g);
              }
              return [...m.values()].sort((a, b) => b.tokens - a.tokens);
            };
            const outcomes = ['completed', 'failed', 'cancelled'].map((o) => ({ outcome: o, events: rows.filter((c) => c.outcome === o).length })).filter((o) => o.events);
            const subs = rows.filter((c) => c.subagent_id);
            return {
              total_tokens: total,
              input_tokens: Math.round(total * 0.28), output_tokens: Math.round(total * 0.17),
              cache_read_tokens: Math.round(total * 1.4), cache_write_tokens: Math.round(total * 0.3),
              events: rows.length,
              sessions: new Set(rows.map((c) => c.session.id)).size,
              active_days: new Set(rows.map((c) => new Date(c.ts).toISOString().slice(0, 10))).size,
              cost_usd: total * 0.000012,
              first_ts: Math.min(...rows.map((c) => c.ts)), last_ts: Math.max(...rows.map((c) => c.ts)),
              subagent_events: subs.length, subagent_tokens: subs.reduce((a, c) => a + c.tokens, 0),
              by_purpose: group((c) => wcKey(c.purpose, c.session.mode)).map((g) => ({ purpose: g.name, requests: g.events, tokens: g.tokens, cost_usd: g.cost_usd })),
              by_outcome: outcomes,
              by_mode: group((c) => c.session.mode),
              by_model: group((c) => c.model),
              by_provider: group((c) => (c.model.startsWith('claude') ? 'anthropic' : c.model.startsWith('glm') ? 'zai' : 'openai')),
              by_project: group((c) => c.session.project),
              daily: Object.entries(rows.reduce((m, c) => {
                const k = new Date(c.ts).toISOString().slice(0, 10) + '|' + wcKey(c.purpose, c.session.mode);
                m[k] = (m[k] ?? 0) + c.tokens;
                return m;
              }, {})).map(([k, tokens]) => { const [date, purpose] = k.split('|'); return { date, purpose, tokens }; }),
              sessions_list: WC_SESSIONS.filter((s) => s.calls.some((c) => c.ts >= cut)).map((s) => {
                const cs = s.calls.filter((c) => c.ts >= cut);
                const done = cs.filter((c) => c.outcome === 'completed').length;
                return {
                  session_id: s.id, project: s.project,
                  models: [...new Set(cs.filter((c) => !WC_HK.has(c.purpose)).map((c) => c.model))].sort(),
                  events: cs.length, subagents: cs.filter((c) => c.subagent_id).length,
                  tokens: cs.reduce((a, c) => a + c.tokens, 0), cost_usd: cs.reduce((a, c) => a + c.tokens, 0) * 0.000012,
                  completed: done, failed: cs.filter((c) => c.outcome === 'failed').length,
                  cancelled: cs.filter((c) => c.outcome === 'cancelled').length,
                  first_ts: cs[0].ts, last_ts: cs[cs.length - 1].ts,
                  mode: s.mode,
                };
              }).sort((a, b) => b.last_ts - a.last_ts),
            };
          }

          const totalTokens = MODELS.reduce((s, m) => s + m[1], 0);
          const totalCost = MODELS.reduce((s, m) => s + m[3], 0);
          const totalEvents = MODELS.reduce((s, m) => s + m[4], 0);
          const totalSessions = MODELS.reduce((s, m) => s + m[5], 0);

          const WCHAT_CAST = ['Ayla', 'Seraphina', 'Rowan', 'Mira'].map((name,i)=>({character_id:name+'.png',name,chats:14-i*3,replies:1254-i*285,measured_tokens:480000-i*90000,estimated_tokens:15000,first_chat:Date.now()-200*86400000,last_chat:Date.now()-i*86400000}));
          const WCHAT_CHATS = WCHAT_CAST.map((c,i)=>({id:'wc-chat-'+i,title:['A night at the observatory','Letters from the coast','The long way home','The midnight train'][i],kind:i===3?'group':'direct',character_id:i===3?null:c.character_id,messages:1200-i*180,replies:590-i*80,measured_tokens:230000-i*20000,estimated_tokens:11000,created:Date.now()-180*86400000,modified:Date.now()-i*86400000}));
          function chatterStats(args) {
            const c=WCHAT_CAST.find(c=>c.character_id===args.characterId);
            return {name:c?.name??'Your library',totals:{chats:c?14:38,messages:c?2300:7284,user_messages:3200,replies:4084,swipes:4521,measured_tokens:1920000,estimated_tokens:145000,active_minutes:1834},habits:{rerolls:437,rerolled_replies:312,eligible_replies:4084,avg_user_chars:143,avg_reply_chars:862,longest_reply_chars:6810,reasoning_swipes:2024,timed_swipes:3981,branched_chats:8,deleted_chats:3},cast:c?[c]:WCHAT_CAST,chats:WCHAT_CHATS,groups:[WCHAT_CHATS[3]],models:[{model:'claude-sonnet-5',provider:'OpenRouter',swipes:3200,measured_tokens:1400000,estimated_tokens:80000,timed_swipes:3100,total_ms:12400000,measured_ms:10000000,measured_timed_tokens:1300000,estimated_ms:2400000,estimated_timed_tokens:80000},{model:'gemini-3-pro',provider:'Google',swipes:1321,measured_tokens:520000,estimated_tokens:65000,timed_swipes:880,total_ms:4400000,measured_ms:3400000,measured_timed_tokens:450000,estimated_ms:1000000,estimated_timed_tokens:50000}],personas:[{persona_id:'traveller',name:'The Traveller',chats:25,messages:2400},{persona_id:'explorer',name:'The Traveller · Explorer',chats:13,messages:800}],hours:Array.from({length:84},(_,i)=>[Math.floor((Date.now()-i*86400000)/3600000)*3600000,Math.round(20+rng()*100)]),co_creator_sessions:12,first_chat:Date.now()-180*86400000,last_chat:Date.now()};
          }
          function chatterUsage(args) {
            const rows=(names)=>names.map((name,i)=>({name,events:420-i*75,measured_tokens:730000-i*135000,estimated_tokens:17000,cost_usd:4.6-i*.8}));
            return {totals:{events:1428,measured_events:1300,priced_events:1214,input_tokens:2900000,output_tokens:800000,cache_read_tokens:1200000,cache_write_tokens:0,estimated_tokens:52000,cost_usd:24.81,avg_duration_ms:4820,avg_ttft_ms:410},features:rows(['chat','summary','arena','groupDirector','recap']),models:rows(['claude-sonnet-5','gemini-3-pro']),providers:rows(['OpenRouter','Google']),characters:rows(WCHAT_CAST.map(c=>c.character_id)),conversations:rows(WCHAT_CHATS.map(c=>c.id)),outcomes:rows(['completed','cancelled','unknown']),daily:Array.from({length:30},(_,i)=>({name:iso(i),events:44,measured_tokens:Math.round(rng()*180000),estimated_tokens:Math.round(rng()*5000),cost_usd:.7})),calls:args.sessionId?[{id:'demo-generation',ts:Date.now(),model:'claude-sonnet-5',purpose:'chat',outcome:'completed',measured_tokens:14200,estimated_tokens:0,cost_usd:.08,duration_ms:4500,ttft_ms:300}]:[]};
          }

          // Family rollups are shared by the Families list and each family card.
          function familyStatsMock(days) {
            const fams = {};
            MODELS.forEach((m) => {
              const norm = m[0].split('/').pop().split('[')[0].trim().toLowerCase();
              const fam = norm.startsWith('claude') ? 'Claude' : norm.startsWith('gpt') ? 'GPT' : norm.startsWith('gemini') ? 'Gemini' : norm.startsWith('minimax') || norm.startsWith('abab') ? 'Minimax' : 'Other';
              if (!fams[fam]) fams[fam] = { family: fam, tokens: 0, input_tokens: 0, output_tokens: 0, cache_read_tokens: 0, cache_write_tokens: 0, events: 0, sessions: 0, cost_usd: 0, first_ts: Date.now() - 300 * 86400000, last_ts: Date.now(), sources: new Set(), models: [] };
              const row = { model: m[0], tokens: m[1], input_tokens: m[1] * 0.62, output_tokens: m[1] * 0.31, cache_read_tokens: m[1] * 1.6, cache_write_tokens: m[1] * 0.5, events: m[4], sessions: m[5], cost_usd: m[3], first_ts: Date.now() - 300 * 86400000, last_ts: Date.now() - MODELS.indexOf(m) * 86400000, sources: m[2], active_days: Math.max(1, Math.min(Math.round((days ?? 90) * 0.6), 42)) };
              const f = fams[fam]; f.tokens += m[1]; f.input_tokens += row.input_tokens; f.output_tokens += row.output_tokens; f.cache_read_tokens += row.cache_read_tokens; f.cache_write_tokens += row.cache_write_tokens; f.events += m[4]; f.sessions += m[5]; f.cost_usd += m[3]; m[2].forEach((s) => f.sources.add(s)); f.models.push(row);
            });
            return Object.values(fams).map((f) => ({ ...f, sources: [...f.sources], models: f.models.sort((a, b) => b.tokens - a.tokens) })).sort((a, b) => b.tokens - a.tokens);
          }

          function mockData(cmd, args) {
            switch (cmd) {
              case 'get_wackchatter_libraries': return [{id:'demo-library',name:'Story library',available:true,current:true}];
              case 'get_wackchatter_stats': return chatterStats(args);
              case 'get_wackchatter_usage': return chatterUsage(args);
              case 'get_wackchatter_portrait': return '';
              case 'open_wackchatter': return null;
              case 'get_wackcode_detail': return wcDetail(args.days ?? 90);
              case 'get_wackcode_session_calls':
                const session = WC_SESSIONS.find((s) => s.id === args.sessionId);
            return (session?.calls ?? []).map((c) => ({ ...c, purpose: wcKey(c.purpose, session.mode) }));
              case 'get_overview':
                return {
                  total_tokens: totalTokens, input_tokens: totalTokens * 0.62, output_tokens: totalTokens * 0.31,
                  cache_read_tokens: totalTokens * 1.7, cache_write_tokens: totalTokens * 0.55,
                  events: totalEvents, active_days: 214,
                  avg_monthly_tokens: totalTokens / 14, months_tracked: 14,
                  cost_usd: totalCost, first_ts: Date.now() - 420 * 86400000, last_ts: Date.now(),
                  current_streak: 59, longest_streak: 73,
                  by_source: SOURCES.map((s, i) => ({
                    source: s, tokens: Math.round(totalTokens * (WEIGHT[i] / 0.99)),
                    events: Math.round(totalEvents * WEIGHT[i] * 1.6), sessions: Math.round(totalSessions * WEIGHT[i] * 1.8),
                    cost_usd: totalCost * WEIGHT[i] * 1.1,
                  })),
                };
              case 'get_daily': return dailyRows(args.days ?? 90);
              case 'get_by_model':
                return MODELS.map((m) => ({ model: m[0], tokens: m[1] * (args.days > 90 ? 1 : 0.4), events: m[4], cost_usd: m[3], last_ts: Date.now() - MODELS.indexOf(m) * 86400000 }));
              case 'get_active_days': return Math.min(args.days ?? 90, 214);
              case 'get_model_stats':
                return MODELS.map((m) => ({
                  model: m[0], tokens: m[1], input_tokens: m[1] * 0.62, output_tokens: m[1] * 0.31,
                  cache_read_tokens: m[1] * 1.6, cache_write_tokens: m[1] * 0.5,
                  events: m[4], sessions: m[5], cost_usd: m[3],
                  first_ts: Date.now() - 300 * 86400000, last_ts: Date.now() - MODELS.indexOf(m) * 86400000, sources: m[2],
                  active_days: Math.max(1, Math.min(Math.round((args.days ?? 90) * 0.6), 42)),
                }));
              case 'get_daily_by_model': {
                const n = Math.min(args.days ?? 90, 150);
                const rows = [];
                MODELS.forEach((m, mi) => {
                  walk((m[1] / 40), n).forEach((tok, i) => rows.push({ date: iso(n - 1 - i), model: m[0], tokens: Math.round(tok * (1 - mi * 0.1)) }));
                });
                return rows;
              }
              case 'get_daily_cache': {
                const n = Math.min(args.days ?? 90, 365);
                return Array.from({ length: n }, (_, i) => {
                  const d = iso(n - 1 - i);
                  const base = 400000 * (0.4 + (i / n) * 0.8);
                  return { date: d, fresh_input: Math.round(base * 0.4), cache_write: Math.round(base * 0.2), cache_read: Math.round(base * 2.6 * (0.6 + rng() * 0.8)) };
                });
              }
              case 'get_model_detail': {
                const m = MODELS.find((x) => x[0] === args.model);
                if (!m) return null;
                const n = Math.min(args.days ?? 90, 150);
                const daily = Array.from({ length: n }, (_, i) => ({ date: iso(n - 1 - i), tokens: Math.round(m[1] / 90 * (0.3 + rng() * 1.7)) }));
                return {
                  model: m[0], tokens: m[1], input_tokens: m[1] * 0.62, output_tokens: m[1] * 0.31,
                  reasoning_tokens: Math.round(m[1] * 0.12),
                  cache_read_tokens: m[1] * 1.6, cache_write_tokens: m[1] * 0.5,
                  events: m[4], sessions: m[5], cost_usd: m[3],
                  first_ts: Date.now() - Math.min(args.days ?? 300, 300) * 86400000, last_ts: Date.now() - 3600000,
                  active_days: Math.min(187, n), current_streak: 12, longest_streak: 40,
                  peak_day: iso(9), peak_day_tokens: m[1] / 30,
                  by_source: m[2].map((s, i) => ({ source: s, tokens: m[1] * (i ? 0.3 : 0.7), events: m[4] * (i ? 0.3 : 0.7), sessions: m[5] * (i ? 0.3 : 0.7), cost_usd: m[3] * (i ? 0.3 : 0.7) })),
                  by_project: PROJECTS.map((p, i) => ({ project: p[0], tokens: m[1] * p[1], events: m[4] * p[1], sessions: m[5] * p[1], cost_usd: m[3] * p[1], first_ts: Date.now() - 280 * 86400000, last_ts: Date.now() - i * 7200000 })),
                  daily,
                  total_window_tokens: totalTokens,
                };
              }
              case 'get_model_big6': {
                const i = MODELS.findIndex((x) => x[0] === args.model);
                if (i < 0 || i > 6) return null;
                if (i === 6) return { total_days: 50, longest_days: 50, stints: [{ entered: iso(140), exited: iso(90), days: 50 }] };
                return { total_days: 71 + i * 9, longest_days: 41 + i * 9, stints: [{ entered: iso(200), exited: iso(170), days: 30 }, { entered: iso(41 + i * 9), exited: null, days: 41 + i * 9 }] };
              }
              // All-time podium: each seat's runs tile contiguously and no
              // model holds two seats at once (hand-built to stay consistent).
              case 'get_big6_timeline': {
                const run = (model, a, b) => ({ model, entered: iso(a), exited: b == null ? null : iso(b), days: a - (b ?? 0) });
                return {
                  first_date: iso(400),
                  seats: [
                    { rank: 1, runs: [run('claude-sonnet-5', 400, 330), run('gemini-2.5-pro', 330, 140), run('claude-opus-5', 140, null)] },
                    { rank: 2, runs: [run('gpt-4.1', 400, 330), run('claude-sonnet-5', 330, 140), run('gpt-5.6-sol', 140, 40), run('claude-sonnet-5', 40, null)] },
                    { rank: 3, runs: [run('gemini-2.5-pro', 400, 330), run('claude-opus-4.1', 330, 250), run('gpt-5.5', 250, 150), run('gemini-3-pro', 150, null)] },
                    { rank: 4, runs: [run('claude-opus-4.1', 400, 330), run('claude-haiku-4-5', 330, 250), run('gpt-5', 250, 170), run('swe-1-6-slow', 170, 150), run('gpt-5.5', 150, 110), run('gpt-5', 110, 40), run('gpt-5.6-sol', 40, null)] },
                    { rank: 5, runs: [run('claude-haiku-4-5', 400, 330), run('gpt-5.5', 330, 250), run('claude-haiku-4-5', 250, 170), run('gpt-5', 170, 110), run('gpt-5.5', 110, null)] },
                    { rank: 6, runs: [run('gpt-5.5', 400, 330), run('swe-1-6-slow', 330, 250), run('gpt-5.6-sol', 250, 140), run('claude-opus-4.1', 140, 100), run('claude-haiku-4-5', 100, null)] },
                  ],
                };
              }
              case 'get_model_achievements': {
