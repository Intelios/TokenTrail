<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- TokenTrail app icon, Marathon Bone style:
       brand orange block with a block-built Anton "T", grounded by the
       token-mix band (input, output, cache read, cache write) under an
       ink rule. Zero radius everywhere. -->
  <rect width="1024" height="1024" fill="#ff4d00"/>
  <!-- T — crossbar + stem, white on brand orange like the .mk mark -->
  <rect x="168" y="188" width="688" height="128" fill="#ffffff"/>
  <rect x="436" y="188" width="152" height="512" fill="#ffffff"/>
  <!-- ink rule above the mix band -->
  <rect x="0" y="826" width="1024" height="14" fill="#0d0d0b"/>
  <!-- token-mix band: 38 / 30 / 20 / 12 -->
  <rect x="0" y="840" width="389" height="184" fill="#3d8eff"/>
  <rect x="389" y="840" width="307" height="184" fill="#00c2c2"/>
  <rect x="696" y="840" width="205" height="184" fill="#c8e600"/>
  <rect x="901" y="840" width="123" height="184" fill="#ff1f6f"/>
</svg>
