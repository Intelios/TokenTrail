<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TokenTrail — bold concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Anton&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#e8e8e8;font-family:'Inter Tight',system-ui,sans-serif}
.topbar{position:sticky;top:0;z-index:60;display:flex;gap:8px;align-items:center;padding:12px 20px;
  background:rgba(5,5,5,.9);backdrop-filter:blur(12px);border-bottom:1px solid #1c1c1c}
.topbar b{font-size:13px;margin-right:10px}
.topbar a{font-size:12px;color:#8a8a8a;text-decoration:none;padding:5px 11px;border:1px solid #262626;border-radius:99px}
.topbar a:hover{color:#fff;border-color:#555}
.caption{padding:44px 24px 14px;max-width:1240px;margin:0 auto}
.caption .tag{font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:#6a6a6a}
.caption h2{font-size:27px;margin:10px 0 6px;letter-spacing:-.5px}
.caption p{color:#8f8f8f;font-size:14px;margin:0 0 6px;max-width:76ch;line-height:1.65}
.caption p b{color:#d8d8d8;font-weight:600}
.frame{max-width:1240px;margin:0 auto 20px;height:800px;border:1px solid #1f1f1f;border-radius:14px;
  overflow:hidden;position:relative}

/* ═══════════════ 1 · THE TRAIL ═══════════════ */
.t{background:#0e0d0b;color:#f2ede3;font-family:'Bricolage Grotesque',sans-serif;
  display:flex;flex-direction:column;position:relative}
.t::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(0deg,transparent 0 39px,rgba(242,237,227,.035) 39px 40px),
                   repeating-linear-gradient(90deg,transparent 0 39px,rgba(242,237,227,.035) 39px 40px)}
.t .rail{display:flex;align-items:center;gap:26px;padding:0 26px;height:52px;flex:none;
  border-bottom:1px solid rgba(242,237,227,.13);position:relative;z-index:2}
.t .mark{display:flex;align-items:center;gap:10px;font:800 15px/1 'Bricolage Grotesque';letter-spacing:-.3px}
.t .mark svg{overflow:visible}
.t .tabs{display:flex;gap:2px;margin-left:8px}
.t .tabs a{font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:1.3px;text-transform:uppercase;
  color:#8c857a;text-decoration:none;padding:7px 11px;border-radius:4px;transition:.16s}
.t .tabs a:hover{color:#f2ede3;background:rgba(242,237,227,.06)}
.t .tabs a.on{color:#0e0d0b;background:#ff4d1c}
.t .live{margin-left:auto;display:flex;align-items:center;gap:8px;
  font:400 10px/1 'IBM Plex Mono',monospace;letter-spacing:1px;color:#8c857a;text-transform:uppercase}
.t .live i{width:6px;height:6px;border-radius:50%;background:#7ea67a;box-shadow:0 0 9px #7ea67a;animation:bp 2.4s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.3}}

.t .hero{flex:none;position:relative;z-index:2;padding:20px 26px 0}
.t .heroTop{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.t .heroTop h1{font:400 13px/1 'IBM Plex Mono',monospace;letter-spacing:2.4px;text-transform:uppercase;
  color:#8c857a;margin:0}
.t .heroTop .win{font:400 11px/1 'IBM Plex Mono',monospace;color:#f2ede3;letter-spacing:.6px}
.t .heroTop .win em{font-style:normal;color:#ff4d1c}
.t .trace{position:relative;height:150px}
.t .trace svg{display:block;width:100%;height:150px}
.t .brush{position:absolute;top:0;bottom:0;left:58%;right:4%;border-left:1px solid #ff4d1c;border-right:1px solid #ff4d1c;
  background:rgba(255,77,28,.07);pointer-events:none}
.t .brush::before,.t .brush::after{content:'';position:absolute;top:0;width:7px;height:7px;background:#ff4d1c}
.t .brush::before{left:-4px}.t .brush::after{right:-4px}
.t .ruler{display:flex;justify-content:space-between;padding-top:7px;border-top:1px solid rgba(242,237,227,.13);
  font:400 9px/1 'IBM Plex Mono',monospace;letter-spacing:1.3px;color:#6f695f;text-transform:uppercase}

.t .reads{display:flex;position:relative;z-index:2;padding:22px 26px 20px;gap:0}
.t .read{flex:1;padding-right:22px;border-right:1px solid rgba(242,237,227,.13)}
.t .read:last-child{border-right:none}
.t .read .k{font:400 9px/1 'IBM Plex Mono',monospace;letter-spacing:1.7px;text-transform:uppercase;color:#8c857a}
.t .read .v{display:flex;align-items:baseline;margin-top:9px;font:600 40px/1 'Bricolage Grotesque';
  letter-spacing:-2px;font-variant-numeric:tabular-nums}
.t .read .v u{text-decoration:none;font-size:19px;color:#ff4d1c;margin-left:2px;letter-spacing:0}
.t .read .h{font:400 10px/1 'IBM Plex Mono',monospace;color:#6f695f;margin-top:8px}
.roll{display:inline-block;height:40px;overflow:hidden;vertical-align:bottom;text-align:center;
  font-variant-numeric:tabular-nums}
.roll i{display:block;font-style:normal;transform:translateY(0);transition:transform 1.15s cubic-bezier(.2,.75,.25,1)}
.revealed .roll i{transform:translateY(var(--y))}

.t .lanes{flex:1;position:relative;z-index:2;padding:0 26px 18px;min-height:0}
.t .lanes h3{font:400 9px/1 'IBM Plex Mono',monospace;letter-spacing:1.7px;text-transform:uppercase;
  color:#8c857a;margin:0 0 10px;display:flex;justify-content:space-between}
.t .lanes h3 em{font-style:normal;color:#ff4d1c}
.t .lanes .wrap{display:flex;gap:16px;align-items:stretch}
.t .lanes svg{flex:1;display:block;height:150px}
.t .keys{width:186px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.t .keys .r{display:flex;align-items:center;gap:8px;font:400 11px 'IBM Plex Mono',monospace;color:#b8b0a4}
.t .keys .r i{width:14px;height:3px;flex:none}
.t .keys .r span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .keys .r b{color:#f2ede3;font-weight:500}
.t .insight{flex:none;position:relative;z-index:2;display:flex;gap:0;border-top:1px solid rgba(242,237,227,.13)}
.t .insight div{flex:1;padding:14px 26px;border-right:1px solid rgba(242,237,227,.13);
  font:400 12px/1.5 'Bricolage Grotesque';color:#b8b0a4}
.t .insight div:last-child{border-right:none}
.t .insight b{color:#ff4d1c;font-weight:600}

/* ═══════════════ 2 · TERMINAL DELUXE ═══════════════ */
.x{background:#040404;color:#d6d6d6;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  padding:0;display:flex;flex-direction:column;position:relative}
.x::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);opacity:.5}
.x .prompt{display:flex;align-items:center;gap:0;padding:14px 22px;flex:none;color:#4f4f4f;border-bottom:1px solid #171717}
.x .prompt s{text-decoration:none;color:#ffb000}
.x .prompt b{color:#e8e8e8;font-weight:500}
.x .prompt em{font-style:normal;color:#00e5ff}
.x .cur{display:inline-block;width:7px;height:14px;background:#ffb000;margin-left:5px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.x .kbd{margin-left:auto;color:#4f4f4f;border:1px solid #232323;padding:3px 8px;border-radius:4px;font-size:11px}
.x .body{flex:1;padding:18px 22px;min-height:0;display:flex;flex-direction:column;gap:15px}
.x .hd{color:#3d3d3d;letter-spacing:.5px}
.x .hd u{text-decoration:none;color:#ffb000;text-shadow:0 0 12px rgba(255,176,0,.55)}
.x .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:0 26px}
.x .kv div .k{color:#5a5a5a;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.x .kv div .v{font-size:30px;color:#fff;margin-top:6px;letter-spacing:-1px;text-shadow:0 0 22px rgba(255,255,255,.2)}
.x .kv div .v s{text-decoration:none;color:#ffb000;font-size:17px}
.x .kv div .d{color:#4f4f4f;font-size:11px;margin-top:5px}
.x .plot{position:relative;flex:1;min-height:0;border:1px solid #171717;padding:10px 12px 4px;background:#070707}
.x .plot .lbl{position:absolute;top:-7px;left:12px;background:#040404;padding:0 7px;color:#5a5a5a;font-size:10px;letter-spacing:1.4px}
.x .plot svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 5px rgba(255,176,0,.45))}
.x .cols{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;flex:none}
.x .row{display:flex;align-items:center;gap:11px;padding:3px 0;color:#8f8f8f}
.x .row u{text-decoration:none;color:#00e5ff;letter-spacing:-1px;font-size:14px;text-shadow:0 0 10px rgba(0,229,255,.45)}
.x .row span{flex:1;color:#d6d6d6}
.x .row b{color:#fff;font-weight:500}
.x .row i{font-style:normal;color:#4f4f4f;width:52px;text-align:right}
.x .pal{position:absolute;z-index:10;left:50%;top:168px;transform:translateX(-50%);width:520px;
  background:#0b0b0b;border:1px solid #2a2a2a;box-shadow:0 26px 70px rgba(0,0,0,.85);border-radius:7px;overflow:hidden}
.x .pal .in{padding:13px 15px;border-bottom:1px solid #1c1c1c;color:#fff;display:flex;align-items:center;gap:9px}
.x .pal .in s{text-decoration:none;color:#ffb000}
.x .pal .it{padding:9px 15px;display:flex;align-items:center;gap:12px;color:#8f8f8f}
.x .pal .it.on{background:rgba(255,176,0,.11);color:#fff;border-left:2px solid #ffb000;padding-left:13px}
.x .pal .it i{font-style:normal;color:#4f4f4f;width:15px}
.x .pal .it b{margin-left:auto;color:#4f4f4f;font-weight:400;font-size:11px}

/* ═══════════════ 3 · THE SPREAD ═══════════════ */
.s{background:#f4f1ea;color:#111;font-family:'Inter Tight',sans-serif;display:flex;flex-direction:column;overflow:hidden}
.s .nav{display:flex;align-items:center;gap:0;padding:0 30px;height:56px;flex:none;border-bottom:2px solid #111}
.s .nav .mk{font:400 22px/1 'Anton',sans-serif;letter-spacing:.5px;text-transform:uppercase;margin-right:30px}
.s .nav a{font:600 11px/1 'Inter Tight';letter-spacing:.8px;text-transform:uppercase;color:#111;
  text-decoration:none;padding:20px 13px;position:relative;opacity:.42;transition:.18s}
.s .nav a:hover{opacity:1}
.s .nav a.on{opacity:1}
.s .nav a.on::after{content:'';position:absolute;left:13px;right:13px;bottom:-2px;height:4px;background:#2b4cff}
.s .nav a u{text-decoration:none;color:#2b4cff;margin-right:5px}
.s .nav .st{margin-left:auto;font:600 11px 'Inter Tight';letter-spacing:.8px;text-transform:uppercase;
  background:#d9f24f;padding:6px 12px;border:2px solid #111}
.s .top{flex:none;display:grid;grid-template-columns:1.05fr .95fr;border-bottom:2px solid #111}
.s .big{padding:22px 42px 16px 30px;border-right:2px solid #111;position:relative;overflow:hidden}
.s .big .kick{font:600 11px/1 'Inter Tight';letter-spacing:1.6px;text-transform:uppercase;color:#2b4cff}
.s .big .n{font:400 118px/.82 'Anton',sans-serif;letter-spacing:-3px;margin:14px 0 0;display:flex;align-items:flex-start}
.s .big .n u{text-decoration:none;font-size:44px;color:#2b4cff;margin-left:4px}
.s .big .cap{font:400 15px/1.4 'Instrument Serif',Georgia,serif;font-style:italic;color:#444;margin-top:12px;max-width:34ch}
.s .big .rot{position:absolute;right:-4px;top:26px;writing-mode:vertical-rl;font:600 10px 'Inter Tight';
  letter-spacing:2.4px;text-transform:uppercase;color:#999}
.s .quad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.s .q{padding:15px 20px;border-right:2px solid #111;border-bottom:2px solid #111}
.s .q:nth-child(2n){border-right:none}
.s .q:nth-child(n+3){border-bottom:none}
.s .q.fill{background:#2b4cff;color:#fff}
.s .q.lime{background:#d9f24f}
.s .q .k{font:600 10px/1 'Inter Tight';letter-spacing:1.3px;text-transform:uppercase;opacity:.62}
.s .q .v{font:400 40px/1 'Anton',sans-serif;margin-top:9px;letter-spacing:-1px}
.s .q .h{font:500 11px 'Inter Tight';margin-top:6px;opacity:.62}
.s .mid{flex:1;display:grid;grid-template-columns:1fr 292px;min-height:0;border-bottom:2px solid #111}
.s .chart{padding:16px 30px 10px;position:relative;border-right:2px solid #111;display:flex;flex-direction:column}
.s .chart h3{font:600 11px/1 'Inter Tight';letter-spacing:1.5px;text-transform:uppercase;margin:0;
  display:flex;justify-content:space-between}
.s .chart h3 em{font-style:normal;color:#2b4cff}
.s .chart .plot{flex:1;min-height:0;margin-top:10px}
.s .chart svg{width:100%;height:100%;display:block}
.s .side{padding:16px 20px;display:flex;flex-direction:column}
.s .side h3{font:600 11px/1 'Inter Tight';letter-spacing:1.5px;text-transform:uppercase;margin:0 0 12px}
.s .side .r{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px solid rgba(17,17,17,.14);font-size:13px}
.s .side .r u{text-decoration:none;font:400 15px 'Anton',sans-serif;color:#2b4cff;width:22px}
.s .side .r span{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s .side .r b{font:400 15px 'Anton',sans-serif;letter-spacing:-.3px}
.s .pull{flex:none;padding:14px 30px;background:#111;color:#f4f1ea;
  font:400 18px/1.35 'Instrument Serif',Georgia,serif;font-style:italic}
.s .pull b{color:#d9f24f;font-weight:400;font-style:normal}

/* still mode: final frame with no motion, for reliable capture */
.still .up{opacity:1!important;transform:none!important;animation:none!important}
.still .fadein{opacity:1!important;animation:none!important}
.still .trc{stroke-dashoffset:0!important;transition:none!important}
.still .roll i{transform:translateY(var(--y))!important;transition:none!important}
.still .cur,.still .live i{animation:none!important}

/* motion */
.trc{stroke-dasharray:3000;stroke-dashoffset:3000}
.revealed .trc{transition:stroke-dashoffset 1.7s cubic-bezier(.35,0,.15,1);stroke-dashoffset:0}
.fadein{opacity:0}
.revealed .fadein{animation:fi 1s .45s ease forwards}
@keyframes fi{to{opacity:1}}
.up{opacity:0;transform:translateY(11px)}
.revealed .up{animation:u .6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes u{to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="topbar">
  <b>TokenTrail · bold concepts</b>
  <a href="?d=t">1 — The Trail</a>
  <a href="?d=x">2 — Terminal Deluxe</a>
  <a href="?d=s">3 — The Spread</a>
  <a href="?">all</a>
</div>
<div id="mount"></div>

<script>
const NAV=['Overview','Models','Trends','Projects','Activity','Settings'];
const MODELS=[['claude-opus-5','#ff4d1c','8.1M'],['claude-sonnet-5','#e08a3c','5.4M'],
  ['gemini-3-pro','#a8804a','2.1M'],['gpt-5.6-sol','#6e6a5c','1.6M'],
  ['gpt-5.5','#4a4a48','1.3M'],['claude-haiku-4-5','#343433','588K']];
const MONTHS=['SEP','OCT','NOV','DEC','JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG'];

function rng(s){let a=s>>>0;return()=>{a=(a*1664525+1013904223)>>>0;return a/4294967296}}
function series(n,seed,amp){const r=rng(seed);const o=[];let v=.45;
  for(let i=0;i<n;i++){v+=(r()-.47)*(amp||.22);v=Math.max(.05,Math.min(1,v));
    const d=i%7;o.push(v*(d===5||d===6?.45:1)*(.5+i/n*.85))}return o}
function smooth(pts){ // catmull-rom → bezier
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=' C'+c1[0].toFixed(1)+' '+c1[1].toFixed(1)+','+c2[0].toFixed(1)+' '+c2[1].toFixed(1)
      +','+p2[0].toFixed(1)+' '+p2[1].toFixed(1)}
  return d}
function line(d,w,h,pad){const mx=Math.max(...d),st=w/(d.length-1);
  return d.map((v,i)=>[i*st,h-(v/mx)*h*(pad||.9)])}
function stream(layers,w,h){
  const n=layers[0].length,tot=[];
  for(let i=0;i<n;i++)tot.push(layers.reduce((a,l)=>a+l[i],0));
  const mx=Math.max(...tot),st=w/(n-1),acc=new Array(n).fill(0),out=[];
  for(const l of layers){const top=[],bot=[];
    for(let i=0;i<n;i++){const base=h/2+(tot[i]/mx)*h*.44;
      const y0=base-(acc[i]/mx)*h*.88,y1=y0-(l[i]/mx)*h*.88;
      bot.push([i*st,y0]);top.push([i*st,y1]);acc[i]+=l[i]}
    out.push(smooth(top)+' L'+bot[n-1][0].toFixed(1)+' '+bot[n-1][1].toFixed(1)+
      ' '+smooth(bot.reverse()).slice(1).replace(/^M[^C]*/,'')+' Z')}
  return out}
const BLK='▁▂▃▄▅▆▇█';
function spark(d){const mx=Math.max(...d);return d.map(v=>BLK[Math.min(7,Math.floor(v/mx*7.99))]).join('')}
function digits(str){return [...str].map(c=>/\d/.test(c)
  ? `<span class="roll" style="--y:-${+c*40}px"><i>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</i></span>`
  : c).join('')}

/* ── 1 · THE TRAIL ── */
function trail(){
  const W=1140,H=150;
  const d=series(370,7717,.2);
  const pts=line(d,W,H,.86);
  // weekly buckets — daily resolution turns the stream into visual noise
  const lay=[series(56,31,.3),series(56,77,.3),series(56,129,.3),series(56,211,.3),series(56,307,.3)];
  const sp=stream(lay,940,150);
  const reads=[['Total tokens','141','M','input + output + cache'],
    ['Est. cost','268','$','API-equivalent'],['Sessions','1473','','10,314 calls'],
    ['Streak','59','d','longest 59d'],['Cache served','78','%','of all context']];
  return `<div class="frame t" id="t">
    <div class="rail">
      <div class="mark"><svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M2 15 C6 15 5 5 10 5 C15 5 14 15 18 15" stroke="#ff4d1c" stroke-width="2" stroke-linecap="round"/>
        <circle cx="18" cy="15" r="2.6" fill="#ff4d1c"/></svg>TokenTrail</div>
      <div class="tabs">${NAV.map((n,i)=>`<a href="#t" class="${i?'':'on'}">${n}</a>`).join('')}</div>
      <div class="live"><i></i>synced 18:42</div>
    </div>
    <div class="hero">
      <div class="heroTop"><h1>The trail — 16 Jul 2025 → today</h1>
        <div class="win">viewing <em>last 90 days</em> · drag to scrub</div></div>
      <div class="trace">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff4d1c" stop-opacity=".42"/>
            <stop offset="100%" stop-color="#ff4d1c" stop-opacity="0"/></linearGradient></defs>
          <path class="fadein" d="${smooth(pts)} L${W} ${H} L0 ${H} Z" fill="url(#tg)"/>
          <path class="trc" d="${smooth(pts)}" fill="none" stroke="#ff4d1c" stroke-width="1.4"/>
        </svg>
        <div class="brush"></div>
      </div>
      <div class="ruler">${MONTHS.map(m=>`<span>${m}</span>`).join('')}</div>
    </div>
    <div class="reads">
      ${reads.map((r,i)=>`<div class="read up" style="animation-delay:${i*80}ms">
        <div class="k">${r[0]}</div>
        <div class="v">${r[2]==='$'?'<u>$</u>':''}${digits(r[1])}${r[2]&&r[2]!=='$'?`<u>${r[2]}</u>`:''}</div>
        <div class="h">${r[3]}</div></div>`).join('')}
    </div>
    <div class="lanes">
      <h3><span>Model adoption over time</span><em>opus-5 overtook sonnet-5 on 12 Jun</em></h3>
      <div class="wrap">
        <svg viewBox="0 0 940 150" preserveAspectRatio="none">
          ${sp.map((p,i)=>`<path class="fadein" style="animation-delay:${i*90}ms" d="${p}"
            fill="${MODELS[i][1]}" opacity=".82"/>`).join('')}
        </svg>
        <div class="keys">${MODELS.slice(0,5).map((m,i)=>`<div class="r up" style="animation-delay:${400+i*70}ms">
          <i style="background:${m[1]}"></i><span>${m[0]}</span><b>${m[2]}</b></div>`).join('')}</div>
      </div>
    </div>
    <div class="insight">
      <div>You work in <b>bursts</b> — 62% of tokens land on just 14 days.</div>
      <div><b>78%</b> of your context is served from cache, saving ~$740.</div>
      <div>Peak hour is <b>15:00</b>; only 1% of work happens after midnight.</div>
    </div>
  </div>`;
}

/* ── 2 · TERMINAL DELUXE ── */
function term(){
  const d=series(120,4242,.22);
  const pts=line(d,900,150,.88);
  const kv=[['total tokens','141','M','input+output+cache'],['est. cost','268','$','api-equivalent'],
    ['sessions','1,473','','10,314 calls'],['streak','59','d','longest 59d']];
  return `<div class="frame x" id="x">
    <div class="prompt"><s>❯</s>&nbsp;<b>tokentrail</b>&nbsp;<em>overview</em>&nbsp;--range 90d<span class="cur"></span>
      <span class="kbd">⌘K  jump anywhere</span></div>
    <div class="pal">
      <div class="in"><s>❯</s><span>mod</span><span class="cur"></span></div>
      <div class="it on"><i>→</i>go to <b>models</b></div>
      <div class="it"><i>·</i>merge model aliases<b>settings</b></div>
      <div class="it"><i>·</i>model share over time<b>trends</b></div>

    </div>
    <div class="body">
      <div class="hd">┌─ <u>OVERVIEW</u> ────────────────────────────────────────────────────── all harnesses · all time ─┐</div>
      <div class="kv">${kv.map((k,i)=>`<div class="up" style="animation-delay:${i*70}ms"><div class="k">${k[0]}</div>
        <div class="v">${k[2]==='$'?'<s>$</s>':''}${k[1]}${k[2]&&k[2]!=='$'?`<s>${k[2]}</s>`:''}</div>
        <div class="d">${k[3]}</div></div>`).join('')}</div>
      <div class="plot">
        <div class="lbl">DAILY TOKENS · 90D</div>
        <svg viewBox="0 0 900 150" preserveAspectRatio="none">
          <path class="trc" d="${smooth(pts)}" fill="none" stroke="#ffb000" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="cols">
        <div><div class="hd" style="margin-bottom:7px">── top models ──────────────────────────</div>
          ${MODELS.slice(0,4).map((m,i)=>`<div class="row up" style="animation-delay:${300+i*60}ms">
            <span>${m[0].padEnd(18,' ').replace(/ /g,'&nbsp;')}</span>
            <u>${spark(series(22,900+i*13,.3))}</u><b>${m[2]}</b></div>`).join('')}</div>
        <div><div class="hd" style="margin-bottom:7px">── harnesses ─────────────</div>
          ${[['claude_code','67%'],['codex','19%'],['zcode','8%'],['antigravity','6%']].map((s,i)=>
            `<div class="row up" style="animation-delay:${340+i*60}ms"><span>${s[0]}</span><i>${s[1]}</i></div>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

/* ── 3 · THE SPREAD ── */
function spread(){
  const d=series(90,1213,.24);
  const pts=line(d,760,190,.9);
  const q=[['','Est. cost','$268','api-equivalent'],['fill','Sessions','1,473','10,314 calls'],
    ['lime','Streak','59d','longest ever'],['','Active days','373','since Jul 2025']];
  return `<div class="frame s" id="s">
    <div class="nav"><div class="mk">TokenTrail</div>
      ${NAV.map((n,i)=>`<a href="#s" class="${i?'':'on'}"><u>0${i+1}</u>${n}</a>`).join('')}
      <div class="st">Synced 18:42</div></div>
    <div class="top">
      <div class="big">
        <div class="kick">Total tokens · all time</div>
        <div class="n up">141<u>M</u></div>
        <div class="cap up" style="animation-delay:120ms">Enough to re-read the entire Linux kernel source
          about nine times over — and you did it in thirteen months.</div>
        <div class="rot">All harnesses combined</div>
      </div>
      <div class="quad">${q.map((x,i)=>`<div class="q ${x[0]} up" style="animation-delay:${i*80}ms">
        <div class="k">${x[1]}</div><div class="v">${x[2]}</div><div class="h">${x[3]}</div></div>`).join('')}</div>
    </div>
    <div class="mid">
      <div class="chart"><h3><span>Daily tokens — last 90 days</span><em>▲ 18% vs previous</em></h3>
        <div class="plot"><svg viewBox="0 0 760 190" preserveAspectRatio="none">
          <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2b4cff" stop-opacity=".22"/>
            <stop offset="100%" stop-color="#2b4cff" stop-opacity="0"/></linearGradient></defs>
          <path class="fadein" d="${smooth(pts)} L760 190 L0 190 Z" fill="url(#sg)"/>
          <path class="trc" d="${smooth(pts)}" fill="none" stroke="#111" stroke-width="2"/>
        </svg></div>
      </div>
      <div class="side"><h3>Top models · 30 days</h3>
        ${MODELS.slice(0,6).map((m,i)=>`<div class="r up" style="animation-delay:${240+i*60}ms">
          <u>${i+1}</u><span>${m[0]}</span><b>${m[2]}</b></div>`).join('')}</div>
    </div>
    <div class="pull">“You work in bursts — <b>62%</b> of your tokens land on just <b>14 days</b> of the year.”</div>
  </div>`;
}

const CAPS=[
  ['t','1 — The Trail','<b>Structural move: time becomes the spine.</b> No sidebar, no stat-card grid. '+
   'The app opens on your entire history as one scrubbable seismograph trace — drag the brush and every '+
   'readout below recomputes for that window. Beneath it, model adoption as a stream: you can literally see '+
   'Opus overtake Sonnet. Numbers roll like an odometer instead of just appearing. '+
   'Cartographic palette — warm charcoal, survey grid, one vermilion signal.',trail],
  ['x','2 — Terminal Deluxe','<b>Structural move: navigation disappears into ⌘K.</b> Every byte of this data '+
   'came out of a CLI, and you live in one. No nav chrome at all — the header is a prompt, and the command '+
   'palette is how you move. Strict mono grid, box-drawing rules, inline block-character sparklines, phosphor '+
   'bloom on the traces. Dense, fast, and completely unlike a web dashboard.',term],
  ['s','3 — The Spread','<b>Structural move: the app narrates instead of reporting.</b> Laid out as an editorial '+
   'spread — hard 2px rules, flat colour blocks, a 118px Anton hero number, numbered nav. Copy does real work: '+
   'the caption and the pull-quote turn statistics into sentences about you. Loud, printed, opinionated.',spread],
];
const only=new URLSearchParams(location.search).get('d');
const shown=only?CAPS.filter(c=>c[0]===only):CAPS;
document.getElementById('mount').innerHTML=shown.map(([id,h,p,fn])=>
  `<div class="caption"><div class="tag">${id==='t'?'concept 01':id==='x'?'concept 02':'concept 03'}</div>
   <h2>${h}</h2><p>${p}</p></div>${fn()}`).join('');
// stroke-dasharray must cover the full path or the trace draws in broken segments
document.querySelectorAll('path.trc').forEach(p=>{
  const L=Math.ceil(p.getTotalLength())+2;
  p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
  p.style.setProperty('--len',L);
});
if(new URLSearchParams(location.search).has('still')){
  document.body.classList.add('still');
  document.querySelectorAll('.frame').forEach(f=>f.classList.add('revealed'));
}else{
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting)e.target.classList.add('revealed')}),{threshold:.12});
  document.querySelectorAll('.frame').forEach(f=>io.observe(f));
  // the observer never fires while the pane is backgrounded; reveal anyway so the
  // page is not stuck blank when it comes back into view
  setTimeout(()=>{
    if(!document.querySelector('.frame.revealed'))
      document.querySelectorAll('.frame').forEach(f=>f.classList.add('revealed'));
  },1600);
}
</script>
