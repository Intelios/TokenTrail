<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TokenTrail — design directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { margin:0; background:#050609; color:#e2e8f0; font-family:'Inter Tight',ui-sans-serif,system-ui,sans-serif; }

.topbar { position:sticky; top:0; z-index:50; display:flex; gap:8px; align-items:center;
  padding:12px 20px; background:rgba(5,6,9,.86); backdrop-filter:blur(12px); border-bottom:1px solid #1a1d26; }
.topbar b { font-size:13px; letter-spacing:.4px; margin-right:10px; }
.topbar a { font-size:12px; color:#8b95ab; text-decoration:none; padding:5px 11px; border:1px solid #222634; border-radius:99px; }
.topbar a:hover { color:#fff; border-color:#3a4256; }

.caption { padding:44px 24px 14px; max-width:1240px; margin:0 auto; }
.caption .tag { font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:2px; text-transform:uppercase; color:#6b7385; }
.caption h2 { font-size:26px; margin:10px 0 6px; letter-spacing:-.4px; }
.caption p { color:#8b95ab; font-size:14px; margin:0; max-width:70ch; line-height:1.6; }

.frame { max-width:1240px; margin:0 auto 20px; height:760px; border:1px solid #1c202b; border-radius:14px;
  overflow:hidden; display:grid; grid-template-columns:212px 1fr; position:relative; }
.frame main { overflow:hidden; padding:26px 30px; }
.frame h1 { margin:0 0 4px; }

/* ============================== A — INSTRUMENT ============================== */
.dir-a { background:#08090c; grid-template-columns:200px 1fr; }
.dir-a aside { background:#0a0b0f; border-right:1px solid #171a21; padding:20px 12px; display:flex; flex-direction:column; }
.dir-a .brand { display:flex; align-items:center; gap:9px; font:600 13px/1 'IBM Plex Mono',monospace;
  letter-spacing:1.5px; text-transform:uppercase; color:#fff; margin:2px 6px 26px; }
.dir-a .brand i { width:7px; height:7px; border-radius:50%; background:#ffc857; box-shadow:0 0 0 3px rgba(255,200,87,.13),0 0 14px #ffc857;
  animation:pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
.dir-a nav { display:flex; flex-direction:column; gap:1px; }
.dir-a nav a { position:relative; padding:8px 12px; border-radius:5px; color:#727a8c; text-decoration:none;
  font:500 12px/1 'IBM Plex Mono',monospace; letter-spacing:.6px; text-transform:uppercase; transition:.16s; }
.dir-a nav a:hover { color:#c9d1e0; background:#111319; }
.dir-a nav a.on { color:#08090c; background:#ffc857; font-weight:600; }
.dir-a .sync { margin-top:auto; font:400 10px/1.7 'IBM Plex Mono',monospace; color:#5b6376; padding:0 6px; }
.dir-a .sync button { width:100%; margin-bottom:8px; background:none; border:1px solid #2a2f3d; color:#e2e8f0;
  padding:8px; border-radius:5px; font:500 11px 'IBM Plex Mono',monospace; letter-spacing:1px;
  text-transform:uppercase; cursor:pointer; transition:.16s; }
.dir-a .sync button:hover { border-color:#ffc857; color:#ffc857; }

.dir-a h1 { font:600 17px/1 'IBM Plex Mono',monospace; letter-spacing:2.4px; text-transform:uppercase; color:#fff; }
.dir-a .sub { color:#646b7d; font-size:12px; margin:0 0 22px; font-family:'IBM Plex Mono',monospace; }
.dir-a .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:0; border:1px solid #191d26;
  border-radius:8px; overflow:hidden; margin-bottom:18px; background:#0b0d12; }
.dir-a .stat { padding:15px 16px; border-right:1px solid #191d26; position:relative; }
.dir-a .stat:last-child { border-right:none; }
.dir-a .stat::before { content:''; position:absolute; left:0; top:0; width:100%; height:1px;
  background:linear-gradient(90deg,transparent,var(--c,#ffc857),transparent); opacity:.55; }
.dir-a .stat .k { font:500 9px/1 'IBM Plex Mono',monospace; letter-spacing:1.6px; text-transform:uppercase; color:#5f6779; }
.dir-a .stat .v { font:500 27px/1 'IBM Plex Mono',monospace; margin-top:11px; color:#fff; letter-spacing:-.5px; }
.dir-a .stat .v s { text-decoration:none; font-size:15px; color:var(--c,#ffc857); margin-left:1px; }
.dir-a .stat .h { font:400 10px/1 'IBM Plex Mono',monospace; color:#565d6e; margin-top:7px; }
.dir-a .panel { border:1px solid #191d26; border-radius:8px; background:#0b0d12; padding:14px 16px; margin-bottom:16px; }
.dir-a .panel > h3 { font:500 9px/1 'IBM Plex Mono',monospace; letter-spacing:1.8px; text-transform:uppercase;
  color:#5f6779; margin:0 0 2px; display:flex; justify-content:space-between; }
.dir-a .panel > h3 em { font-style:normal; color:#ffc857; }
.dir-a .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.dir-a .lg { display:flex; flex-direction:column; gap:9px; margin-top:12px; }
.dir-a .lg .r { display:flex; align-items:center; gap:9px; font:400 11px 'IBM Plex Mono',monospace; color:#aab3c4; }
.dir-a .lg .r i { width:6px; height:6px; flex:none; }
.dir-a .lg .r span { flex:1; }
.dir-a .lg .r b { color:#fff; font-weight:500; }

/* ============================== B — EDITORIAL ============================== */
.dir-b { background:#100e0c; grid-template-columns:214px 1fr; }
.dir-b aside { background:#0b0a08; border-right:1px solid #241f1a; padding:24px 16px; display:flex; flex-direction:column; }
.dir-b .brand { font:400 21px/1 'Instrument Serif',Georgia,serif; color:#f6f1e8; margin:0 8px 30px;
  display:flex; align-items:baseline; gap:8px; }
.dir-b .brand i { width:6px; height:6px; border-radius:50%; background:#e8752a; flex:none; }
.dir-b nav { display:flex; flex-direction:column; gap:1px; }
.dir-b nav a { padding:8px 10px; color:#8a8073; text-decoration:none; font-size:14px; border-radius:6px;
  position:relative; transition:.18s; }
.dir-b nav a:hover { color:#f6f1e8; }
.dir-b nav a.on { color:#f6f1e8; }
.dir-b nav a.on::before { content:''; position:absolute; left:-16px; top:8px; bottom:8px; width:2px; background:#e8752a; }
.dir-b .sync { margin-top:auto; color:#6e665b; font-size:11px; line-height:1.7; padding:0 8px; }
.dir-b .sync button { width:100%; margin-bottom:8px; background:#e8752a; border:none; color:#100e0c;
  padding:9px; border-radius:6px; font:600 12px 'Inter Tight',sans-serif; cursor:pointer; transition:.18s; }
.dir-b .sync button:hover { background:#f5893f; }

.dir-b h1 { font:400 38px/1 'Instrument Serif',Georgia,serif; color:#f6f1e8; letter-spacing:-.5px; }
.dir-b .sub { color:#8a8073; font-size:14px; margin:8px 0 26px; font-style:italic; font-family:'Instrument Serif',serif; }
.dir-b .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:26px; margin-bottom:26px;
  padding-bottom:24px; border-bottom:1px solid #241f1a; }
.dir-b .stat .k { font:500 10px/1 'Inter Tight',sans-serif; letter-spacing:1.3px; text-transform:uppercase; color:#7d7466; }
.dir-b .stat .v { font:400 40px/1 'Instrument Serif',Georgia,serif; color:#f6f1e8; margin-top:10px; letter-spacing:-1px; }
.dir-b .stat .v s { text-decoration:none; font-size:22px; color:#e8752a; }
.dir-b .stat .h { font-size:12px; color:#6e665b; margin-top:8px; }
.dir-b .panel { margin-bottom:26px; }
.dir-b .panel > h3 { font:400 19px/1 'Instrument Serif',Georgia,serif; color:#f6f1e8; margin:0 0 3px;
  display:flex; justify-content:space-between; align-items:baseline; }
.dir-b .panel > h3 em { font:500 11px 'Inter Tight',sans-serif; font-style:normal; letter-spacing:1px;
  text-transform:uppercase; color:#e8752a; }
.dir-b .two { display:grid; grid-template-columns:1fr 1fr; gap:34px; }
.dir-b .lg { display:flex; flex-direction:column; gap:11px; margin-top:14px; }
.dir-b .lg .r { display:flex; align-items:center; gap:10px; font-size:13px; color:#c3b9a9; }
.dir-b .lg .r i { width:8px; height:8px; border-radius:50%; flex:none; }
.dir-b .lg .r span { flex:1; }
.dir-b .lg .r b { color:#f6f1e8; font-weight:500; font-variant-numeric:tabular-nums; }

/* ============================== C — ARCADE ============================== */
.dir-c { background:#0a0616; grid-template-columns:206px 1fr;
  background-image:linear-gradient(rgba(124,58,237,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.055) 1px,transparent 1px);
  background-size:34px 34px; }
.dir-c aside { background:rgba(13,7,26,.72); border-right:1px solid #241546; padding:20px 14px; display:flex; flex-direction:column; }
.dir-c .brand { font:800 16px/1 'Archivo',sans-serif; letter-spacing:-.4px; margin:2px 4px 24px;
  display:flex; align-items:center; gap:9px;
  background:linear-gradient(92deg,#f0abfc,#38bdf8); -webkit-background-clip:text; background-clip:text; color:transparent; }
.dir-c .brand i { width:11px; height:11px; border-radius:4px; flex:none;
  background:linear-gradient(135deg,#e879f9,#38bdf8); box-shadow:0 0 16px rgba(232,121,249,.75); }
.dir-c nav { display:flex; flex-direction:column; gap:3px; }
.dir-c nav a { padding:9px 12px; border-radius:9px; color:#9b8dc4; text-decoration:none;
  font:600 13px 'Archivo',sans-serif; transition:.18s; }
.dir-c nav a:hover { color:#fff; background:rgba(124,58,237,.16); transform:translateX(2px); }
.dir-c nav a.on { color:#0a0616; background:linear-gradient(95deg,#e879f9,#38bdf8); box-shadow:0 4px 18px rgba(232,121,249,.32); }
.dir-c .sync { margin-top:auto; color:#7c6ba8; font-size:11px; line-height:1.7; padding:0 4px; }
.dir-c .sync button { width:100%; margin-bottom:8px; background:linear-gradient(95deg,#e879f9,#38bdf8);
  border:none; color:#0a0616; padding:10px; border-radius:9px; font:700 12px 'Archivo',sans-serif; cursor:pointer;
  box-shadow:0 4px 16px rgba(232,121,249,.3); transition:.18s; }
.dir-c .sync button:hover { transform:translateY(-1px); box-shadow:0 7px 22px rgba(232,121,249,.45); }

.dir-c h1 { font:900 30px/1 'Archivo',sans-serif; letter-spacing:-1px; color:#fff; }
.dir-c .sub { color:#9b8dc4; font-size:13px; margin:7px 0 20px; font-weight:500; }
.dir-c .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
.dir-c .stat { background:rgba(23,13,43,.8); border:1px solid #2e1b5c; border-radius:15px; padding:15px 16px;
  position:relative; overflow:hidden; transition:.2s; }
.dir-c .stat:hover { transform:translateY(-3px); border-color:#5b34b8; }
.dir-c .stat::after { content:''; position:absolute; inset:0 auto auto 0; width:100%; height:2px;
  background:linear-gradient(90deg,var(--c,#e879f9),transparent); }
.dir-c .stat .k { font:700 10px/1 'Archivo',sans-serif; letter-spacing:.9px; text-transform:uppercase; color:#8f7fbd; }
.dir-c .stat .v { font:900 30px/1 'Archivo',sans-serif; margin-top:11px; color:#fff; letter-spacing:-1.2px; }
.dir-c .stat .v s { text-decoration:none; font-size:17px; color:var(--c,#e879f9); }
.dir-c .stat .h { font:500 11px 'Archivo',sans-serif; color:#7c6ba8; margin-top:7px; }
.dir-c .panel { background:rgba(23,13,43,.8); border:1px solid #2e1b5c; border-radius:15px;
  padding:15px 17px; margin-bottom:16px; }
.dir-c .panel > h3 { font:700 12px/1 'Archivo',sans-serif; letter-spacing:.4px; color:#c4b5fd; margin:0 0 2px;
  display:flex; justify-content:space-between; }
.dir-c .panel > h3 em { font-style:normal; color:#38bdf8; }
.dir-c .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.dir-c .lg { display:flex; flex-direction:column; gap:9px; margin-top:12px; }
.dir-c .lg .r { display:flex; align-items:center; gap:9px; font:600 12px 'Archivo',sans-serif; color:#c4b5fd; }
.dir-c .lg .r i { width:9px; height:9px; border-radius:3px; flex:none; }
.dir-c .lg .r span { flex:1; }
.dir-c .lg .r b { color:#fff; font-weight:800; }

/* shared chart bits */
.chartwrap { position:relative; }
.trace { stroke-dasharray:2400; stroke-dashoffset:2400; }
.revealed .trace { animation:draw 1.5s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset:0 } }
.areafill { opacity:0; }
.revealed .areafill { animation:fadein .9s .5s ease forwards; }
@keyframes fadein { to { opacity:1 } }
.stat, .lg .r { opacity:0; transform:translateY(9px); }
.revealed .stat, .revealed .lg .r { animation:rise .55s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes rise { to { opacity:1; transform:none } }
</style>
</head>
<body>

<div class="topbar">
  <b>TokenTrail · design directions</b>
  <a href="#a">A — Instrument</a>
  <a href="#b">B — Editorial</a>
  <a href="#c">C — Arcade</a>
</div>

<div id="mount"></div>

<script>
const SOURCES = [
  ['Claude Code', '#fb923c'], ['Codex', '#34d399'], ['ZCode', '#a78bfa'],
  ['OpenCode', '#f472b6'], ['Antigravity', '#22d3ee'], ['Gemini CLI', '#60a5fa'],
];
const MODELS = [
  ['claude-opus-5', '8.1M'], ['claude-sonnet-5', '5.4M'], ['gemini-3-pro', '2.1M'],
  ['gpt-5.6-sol', '1.6M'], ['gpt-5.5', '1.3M'], ['claude-haiku-4-5', '588K'],
];
const NAV = ['Overview','Models','Trends','Projects','Activity','Settings'];

function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function series(n, seed){
  const r = rng(seed); const out=[]; let v=.45;
  for(let i=0;i<n;i++){ v += (r()-.47)*.22; v=Math.max(.06,Math.min(1,v));
    const dow=i%7; out.push(v*(dow===5||dow===6?.42:1)*(0.55+i/n*0.7)); }
  return out;
}
function path(data,w,h,close){
  const st=w/(data.length-1); const mx=Math.max(...data);
  let d=''; data.forEach((v,i)=>{ const x=i*st, y=h-(v/mx)*h*.92;
    d += i? ' L'+x.toFixed(1)+' '+y.toFixed(1) : 'M'+x.toFixed(1)+' '+y.toFixed(1); });
  if(close) d += ' L'+w+' '+h+' L0 '+h+' Z';
  return d;
}
function areaChart(id, colors, h){
  const w=880; const layers = colors.map((c,i)=>({c, d:series(90, 991+i*37)}));
  let defs='', paths='';
  layers.forEach((l,i)=>{
    defs += `<linearGradient id="${id}g${i}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${l.c}" stop-opacity=".5"/>
      <stop offset="100%" stop-color="${l.c}" stop-opacity="0"/></linearGradient>`;
    paths += `<path class="areafill" d="${path(l.d,w,h,true)}" fill="url(#${id}g${i})"/>
      <path class="trace" d="${path(l.d,w,h,false)}" fill="none" stroke="${l.c}" stroke-width="1.6"
        stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">
    <defs>${defs}</defs>${paths}</svg>`;
}
function bars(color, h){
  const d=series(24, 4242); const w=440; const bw=w/24;
  const mx=Math.max(...d);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">` +
    d.map((v,i)=>{ const bh=(v/mx)*h*.9; return `<rect x="${(i*bw+2).toFixed(1)}" y="${(h-bh).toFixed(1)}"
      width="${(bw-4).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}" opacity="${(.35+v/mx*.65).toFixed(2)}"/>`; }).join('') +
    `</svg>`;
}

function frame(dir){
  const cols = SOURCES.map(s=>s[1]);
  const accent = { a:'#ffc857', b:'#e8752a', c:'#e879f9' }[dir];
  const statColors = { a:['#ffc857','#4ade80','#22d3ee','#f472b6'], b:[accent,accent,accent,accent],
                       c:['#e879f9','#38bdf8','#a3e635','#fb923c'] }[dir];
  const stats = [
    ['Total tokens','141','M','input + output + cache'],
    ['Est. cost','268','$','API-equivalent estimate'],
    ['Sessions','1,473','','10,314 model calls'],
    ['Current streak','59','d','longest 59d'],
  ];
  return `
  <div class="frame dir-${dir}" id="${dir}">
    <aside>
      <div class="brand"><i></i><span>TokenTrail</span></div>
      <nav>${NAV.map((n,i)=>`<a href="#${dir}" class="${i===0?'on':''}">${n}</a>`).join('')}</nav>
      <div class="sync"><button>Sync now</button><div>last sync 18:42</div></div>
    </aside>
    <main>
      <h1>Overview</h1>
      <p class="sub">All harnesses, all time — from your own TokenTrail database</p>
      <div class="stats">
        ${stats.map((s,i)=>`<div class="stat" style="--c:${statColors[i]};animation-delay:${i*70}ms">
          <div class="k">${s[0]}</div>
          <div class="v">${s[2]==='$'?'<s>$</s>':''}${s[1]}${s[2]&&s[2]!=='$'?`<s>${s[2]}</s>`:''}</div>
          <div class="h">${s[3]}</div></div>`).join('')}
      </div>
      <div class="panel">
        <h3><span>Daily tokens — last 90 days</span><em>+18% vs prev</em></h3>
        <div class="chartwrap">${areaChart(dir, cols.slice(0,4), 190)}</div>
      </div>
      <div class="two">
        <div class="panel">
          <h3><span>Hour of day</span><em>peak 15:00</em></h3>
          <div class="chartwrap">${bars(accent, 132)}</div>
        </div>
        <div class="panel">
          <h3><span>Top models — 30 days</span></h3>
          <div class="lg">${MODELS.slice(0,5).map((m,i)=>`<div class="r" style="animation-delay:${400+i*60}ms">
            <i style="background:${cols[i]}"></i><span>${m[0]}</span><b>${m[1]}</b></div>`).join('')}</div>
        </div>
      </div>
    </main>
  </div>`;
}

const CAPS = [
  ['a','Direction A — Instrument',
   'Cockpit / oscilloscope precision. Near-black, hairline rules, one signal colour, and every number set in monospace with tabular figures so digits never shift. Restrained and technical — it reads as a measuring device rather than a web page. Motion is functional: traces draw left-to-right, the status dot breathes.'],
  ['b','Direction B — Editorial',
   'Data-journalism, à la The Pudding or FT Graphics. Warm ink background, a display serif for headlines and the big figures, generous whitespace, and no card borders at all — sections are separated by rules and space. Feels considered and human; the stats read as a story about you rather than a readout.'],
  ['c','Direction C — Arcade',
   'Quantified-self as a game. Deep violet grid, gradient accents, heavy Archivo type, chunky rounded cards that lift on hover. The most personality and the most fun — streaks and records feel like achievements. Also the loudest, and the hardest to keep readable across the dense tables on Models/Projects.'],
];

const only = new URLSearchParams(location.search).get('d');
const shown = only ? CAPS.filter(c=>c[0]===only) : CAPS;
document.getElementById('mount').innerHTML = shown.map(([id,h,p])=>`
  <div class="caption"><div class="tag">${id}</div><h2>${h}</h2><p>${p}</p></div>
  ${frame(id)}`).join('');

const io = new IntersectionObserver((es)=>es.forEach(e=>{
  if(e.isIntersecting) e.target.classList.add('revealed');
  else e.target.classList.remove('revealed');
}),{threshold:.18});
document.querySelectorAll('.frame').forEach(f=>io.observe(f));
</script>
</body>
</html>
